name: acekanner
description: "ACEkanner - offline-first examination scanner and grader for college instructors."
publish_to: 'none'

# versionName+versionCode. Bump the build number (after +) for every Play upload.
version: 0.7.1+19

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

  # State and navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Local database (SQLCipher-encrypted, see hooks section below)
  drift: ^2.35.4
  sqlite3: ^3.9.1
  path: ^1.9.1
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  cryptography: ^2.9.0
  crypto: ^3.0.8

  # Wired up in later phases. Declared now so the complete dependency graph is
  # resolved and build-verified from the start (see docs/ARCHITECTURE.md §2).
  camera: ^0.12.2            # Phase 4 - scanner
  pdf: ^3.13.1               # Phase 4/7 - answer sheets, reports
  printing: ^5.15.1          # Phase 4/7 - Android print service
  excel_plus: ^2.29.3        # Phase 7 - .xlsx export (MIT; the original `excel` package is unmaintained)
  csv: ^8.0.0                # Phase 3/7 - roster import, CSV export
  share_plus: ^13.3.1        # Phase 7 - share exports
  file_picker: ^13.3.3       # Phase 3/7 - roster import, backup restore
  in_app_purchase: ^3.3.1    # Phase 6 - Google Play Billing
  in_app_purchase_android: ^0.5.5  # Phase 6 - choose the subscription base plan
  url_launcher: ^6.3.2       # Phase 6 - "Manage subscription" in Google Play
  google_sign_in: ^7.2.0     # Phase 6 - one-time sign-in
  supabase_flutter: ^2.18.3  # Phase 6 - licensing backend

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/LICENSE-Roboto.txt

hooks:
  user_defines:
    sqlite3:
      # Android: load SQLCipher (libsqlcipher.so) bundled from the official
      # net.zetetic:sqlcipher-android AAR on Maven Central (see
      # android/app/build.gradle.kts). Other platforms (host unit tests on
      # Linux/macOS) use the operating system's SQLite.
      source:
        android: system
        default: system
      name:
        android: sqlcipher
        default: sqlite3
